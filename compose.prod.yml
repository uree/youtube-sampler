services:
  redis:
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 100
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  flask:
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 200
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: unless-stopped
    command: celery -A run.celery_app worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=10 --prefetch-multiplier=1 -f app/logs/celery.log
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 300
    logging:
      options:
        max-size: "10m"
        max-file: "3"
